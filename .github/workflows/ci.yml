name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seller_finance_tests
          POSTGRES_USER: seller_finance
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seller_finance -d seller_finance_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=seller_finance_tests;Username=seller_finance;Password=integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Restore backend
        run: dotnet tool restore && dotnet restore SellerFinance.slnx
      - name: Test backend and API E2E
        run: dotnet test SellerFinance.slnx --configuration Release --no-restore --filter "Category!=Performance" --logger "trx;LogFileName=tests.trx"
      - name: Performance gate — 100k order items
        run: dotnet test SellerFinance.slnx --configuration Release --no-restore --no-build --filter "Category=Performance" --logger "trx;LogFileName=performance.trx" --logger "console;verbosity=detailed"
      - name: Install frontend dependencies
        working-directory: src/SellerFinance.Web
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: src/SellerFinance.Web
        run: pnpm build
      - name: Verify EF migration script
        run: dotnet ef migrations script --idempotent --project src/SellerFinance.Api --startup-project src/SellerFinance.Api --output migration.sql
        env:
          DATABASE_URL: Host=localhost;Database=validation;Username=validation;Password=validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            **/TestResults/*.trx
            migration.sql

  compose-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start local PostgreSQL smoke stack
        run: docker compose up --build -d --wait
      - name: Verify application reaches PostgreSQL
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5068/health/database; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop smoke stack
        if: always()
        run: docker compose down --volumes --remove-orphans
